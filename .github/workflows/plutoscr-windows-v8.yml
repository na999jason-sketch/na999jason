name: PlutoSCR v8 Build
on:
  workflow_dispatch:
  push:
    paths:
      - PlutoSCR_GitHub_Overlay_v8.zip
      - .github/workflows/plutoscr-windows-v8.yml

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/NomaDamas/starcraft-api.git src
          Expand-Archive PlutoSCR_GitHub_Overlay_v8.zip overlay -Force
          Copy-Item overlay\* src -Recurse -Force
          cmake --version

      - name: Configure
        id: cfg
        continue-on-error: true
        shell: pwsh
        run: |
          cmake -S src -B build -A x64 -DSTARCRAFT_API_BUILD_TOOLS=ON 2>&1 | Tee-Object configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        id: bld
        if: steps.cfg.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force result | Out-Null
          if(Test-Path build){
            Get-ChildItem build -Recurse -File -Include *.exe,*.dll |
              ForEach-Object { Copy-Item $_.FullName result -Force }
          }
          foreach($f in @("configure.log","build.log")){
            if(Test-Path $f){ Copy-Item $f result -Force }
          }
          "configure=${{ steps.cfg.outcome }}" | Set-Content result\BUILD_STATUS.txt
          "build=${{ steps.bld.outcome }}" | Add-Content result\BUILD_STATUS.txt

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlutoSCR-v8-Windows-build
          path: result

      - name: Check
        if: always()
        shell: pwsh
        run: |
          if("${{ steps.cfg.outcome }}" -ne "success"){ exit 1 }
          if("${{ steps.bld.outcome }}" -ne "success"){ exit 1 }
