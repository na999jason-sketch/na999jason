name: PlutoSCR v51 x86 Direct-Link Original Pluto Runner
on: { workflow_dispatch: {} }

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare source
        shell: powershell
        run: |
          $ErrorActionPreference="Stop"
          git clone --depth 1 https://github.com/NomaDamas/starcraft-api.git src
          Expand-Archive "PlutoSCR_X86LiveCUnit_v51.zip" "overlay_v51" -Force
          Copy-Item "overlay_v51\*" src -Recurse -Force
          Get-ChildItem src -Recurse -Filter *.vcxproj | % {
            $x=Get-Content $_.FullName -Raw
            $x=$x.Replace("<PlatformToolset>v141_xp</PlatformToolset>","<PlatformToolset>v143</PlatformToolset>")
            $x=$x.Replace("<PlatformToolset>v141</PlatformToolset>","<PlatformToolset>v143</PlatformToolset>")
            Set-Content $_.FullName $x -Encoding UTF8
          }
          $p="src\bwapi\BWAPILIB\BWAPILIB.vcxproj"
          $x=Get-Content $p -Raw
          $x=$x.Replace("<AdditionalIncludeDirectories>","<AdditionalIncludeDirectories>$(ProjectDir)Source;$(ProjectDir)..;")
          Set-Content $p $x -Encoding UTF8

      - name: Build BWAPI static libraries
        shell: powershell
        run: |
          $ErrorActionPreference="Stop"
          $vw="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs=&$vw -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $ms=Get-ChildItem "$vs\MSBuild" -Recurse -Filter MSBuild.exe | ? {$_.FullName -match '\\Bin\\MSBuild\.exe$' -and $_.FullName -notmatch '\\amd64\\'} | select -First 1
          if(!$ms){throw "MSBuild not found"}
          & $ms.FullName "src\bwapi\BWAPILIB\BWAPILIB.vcxproj" /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal
          if($LASTEXITCODE){throw "BWAPILIB failed"}
          & $ms.FullName "src\bwapi\BWAPIClient\BWAPIClient.vcxproj" /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal
          if($LASTEXITCODE){throw "BWAPIClient failed"}
          Write-Host "=== BWAPI LIBS ==="
          Get-ChildItem src -Recurse -File -Filter *.lib | % {Write-Host ("LIB {0} {1}" -f $_.Length,$_.FullName)}

      - name: Direct compile and link v51 resident
        shell: powershell
        run: |
          $ErrorActionPreference="Stop"
          $vw="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs=&$vw -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vc=Get-ChildItem "$vs\VC\Auxiliary\Build" -Filter vcvars32.bat | select -First 1
          if(!$vc){throw "vcvars32 missing"}
          $libs=Get-ChildItem src -Recurse -File -Filter *.lib
          $client=$libs | ? {$_.Name -ieq "BWAPIClient.lib"} | select -First 1
          $bwapi=$libs | ? {$_.Name -ieq "BWAPILIB.lib"} | select -First 1
          if(!$client -or !$bwapi){throw "Required BWAPI libraries not found"}

          New-Item -ItemType Directory build_v51 -Force|Out-Null
          $cmd=@"
          call "$($vc.FullName)"
          cl /nologo /c /EHsc /O2 /std:c++17 /MD /DWIN32 /DNDEBUG /D_WINDOWS /I"src\bwapi\include" src\plutoscr_x86\PlutoSCRX86V51.cpp /Fo"build_v51\PlutoSCRX86V51.obj"
          if errorlevel 1 exit /b 1
          link /nologo /DLL /OUT:"build_v51\PlutoSCRX86V51.dll" "build_v51\PlutoSCRX86V51.obj" "$($client.FullName)" "$($bwapi.FullName)" kernel32.lib user32.lib advapi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /O2 /MD /DWIN32 /D_WINDOWS src\PlutoSCRX86Inject.cpp /Fe:"build_v51\PlutoSCRX86Inject.exe" /link kernel32.lib
          if errorlevel 1 exit /b 1
          "@
          cmd.exe /D /S /C $cmd
          if($LASTEXITCODE){throw "Direct v51 compile/link failed: $LASTEXITCODE"}
          if(!(Test-Path "build_v51\PlutoSCRX86V51.dll")){throw "v51 DLL missing after direct link"}
          if(!(Test-Path "build_v51\PlutoSCRX86Inject.exe")){throw "v51 injector missing"}
          Get-ChildItem build_v51 -File | % {Write-Host ("OUTPUT {0} {1}" -f $_.Length,$_.FullName)}

      - name: Assemble and verify
        shell: powershell
        run: |
          $ErrorActionPreference="Stop"
          New-Item -ItemType Directory artifact_v51 -Force|Out-Null
          Copy-Item "build_v51\PlutoSCRX86V51.dll" artifact_v51
          Copy-Item "build_v51\PlutoSCRX86Inject.exe" artifact_v51
          foreach($n in @("RUN_PLUTO_SCR_X86_V51.cmd","README_V51.txt")){
            $f=Get-ChildItem src -Recurse -File -Filter $n|select -First 1
            if($f){Copy-Item $f.FullName artifact_v51}
          }
          $d=(Get-Item artifact_v51\PlutoSCRX86V51.dll).Length
          $e=(Get-Item artifact_v51\PlutoSCRX86Inject.exe).Length
          if($d -lt 50000){throw "DLL too small: $d"}
          if($e -lt 5000){throw "injector too small: $e"}
          Write-Host "PlutoSCRX86V51.dll=$d bytes"
          Write-Host "PlutoSCRX86Inject.exe=$e bytes"
          Write-Host "PLUTOSCR_V51_X86_DIRECT_LINK_BUILD=PASS"
          Write-Host "PLUTOSCR_V51_X86_DIRECT_LINK_PACKAGE=PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: PlutoSCR-v51-X86-Direct-Link
          path: artifact_v51
          if-no-files-found: error
