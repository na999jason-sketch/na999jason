name: aPlutoTeam Phase2B v1.4 Structural Isolation Grid

on:
  workflow_dispatch:

jobs:
  isolate:
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      PLUTO_RELEASE_URL: https://github.com/tscmoo/pluto/releases/download/cog2026-2578600/pluto-cog2026-2578600.zip
      PLUTO_RELEASE_SHA256: d4e2225446f5048e131065357173952f0286586da77ebb8bddf7fc766c3844a5
      PLUTO_WEIGHTS_SHA256: 00b400eace6e4782202ebdcb3c30db76054aaa6a08c6a7dcb59575abc2d0a26e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Phase2B v1.4 source
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          if (-not (Test-Path "pluto-team")) { throw "pluto-team missing" }
          if (-not (Test-Path "pluto-team\run_phase2b_v1_4_structural_grid.py")) {
            if (-not (Test-Path "pluto-team\aPlutoTeam_Phase2B_v1_4.zip")) { throw "v1.4 ZIP missing" }
            Expand-Archive "pluto-team\aPlutoTeam_Phase2B_v1_4.zip" "pluto-team" -Force
          }
          New-Item -ItemType Directory -Force "pluto-team\phase2b-v1.4-out" | Out-Null
          New-Item -ItemType Directory -Force "pluto-team\official-release" | Out-Null
          Write-Host "PHASE2B_V1_4_SOURCE_READY=YES"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          Push-Location pluto-team
          python -m pytest -q test_phase2b_helpers.py
          Pop-Location

      - name: Download and verify official weights
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $zip="$PWD\pluto-team\official-release\pluto.zip"
          curl.exe -L --fail --retry 5 --retry-delay 3 -o $zip $env:PLUTO_RELEASE_URL
          if ($LASTEXITCODE -ne 0) { throw "curl failed" }
          $sha=(Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($sha -ne $env:PLUTO_RELEASE_SHA256) { throw "release SHA mismatch $sha" }
          Expand-Archive $zip "$PWD\pluto-team\official-release\unpacked" -Force
          $w="$PWD\pluto-team\official-release\unpacked\pluto\pluto_weights.bin"
          if (-not (Test-Path $w)) { throw "weights missing" }
          $wsha=(Get-FileHash -Algorithm SHA256 $w).Hash.ToLower()
          if ($wsha -ne $env:PLUTO_WEIGHTS_SHA256) { throw "weights SHA mismatch $wsha" }
          "PLUTO_WEIGHTS=$w" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "OFFICIAL_WEIGHTS_READY=PASS"

      - name: Run 16-way structural isolation grid
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          Push-Location pluto-team
          python run_phase2b_v1_4_structural_grid.py `
            --weights "$env:PLUTO_WEIGHTS" `
            --out "phase2b-v1.4-out"
          Pop-Location

      - name: Cleanup official release
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "pluto-team\official-release") {
            Remove-Item -Recurse -Force "pluto-team\official-release"
          }

      - name: Upload structural isolation diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aPlutoTeam-Phase2B-v1.4-Structural-Isolation-Grid
          path: pluto-team/phase2b-v1.4-out
          if-no-files-found: error
          compression-level: 9
