name: aPlutoTeam Phase2B v1.5.2 I8 Dump Xref Disassembly

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 12

    env:
      PLUTO_RELEASE_URL: https://github.com/tscmoo/pluto/releases/download/cog2026-2578600/pluto-cog2026-2578600.zip
      PLUTO_RELEASE_SHA256: d4e2225446f5048e131065357173952f0286586da77ebb8bddf7fc766c3844a5
      PLUTO_INFER_SHA256: ad880d8be52a6ef03893fa20644b6627e04fcd55e030178c6d52486b82340f2b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare v1.5.2 source
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          if (-not (Test-Path "pluto-team")) { throw "pluto-team missing" }
          if (-not (Test-Path "pluto-team\analyze_i8_dump_xrefs_v1_5_2.py")) {
            if (-not (Test-Path "pluto-team\aPlutoTeam_Phase2B_v1_5_2.zip")) { throw "v1.5.2 ZIP missing" }
            Expand-Archive "pluto-team\aPlutoTeam_Phase2B_v1_5_2.zip" "pluto-team" -Force
          }
          New-Item -ItemType Directory -Force "pluto-team\official-release" | Out-Null
          New-Item -ItemType Directory -Force "pluto-team\phase2b-v1.5.2-out" | Out-Null
          Write-Host "PHASE2B_V1_5_2_SOURCE_READY=YES"

      - name: Install disassembly dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pefile capstone

      - name: Download and verify official infer engine
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $zip="$PWD\pluto-team\official-release\pluto.zip"
          curl.exe -L --fail --retry 5 --retry-delay 3 -o $zip $env:PLUTO_RELEASE_URL
          if ($LASTEXITCODE -ne 0) { throw "curl failed" }
          $sha=(Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($sha -ne $env:PLUTO_RELEASE_SHA256) { throw "release SHA mismatch $sha" }
          Expand-Archive $zip "$PWD\pluto-team\official-release\unpacked" -Force
          $e="$PWD\pluto-team\official-release\unpacked\pluto\pluto_infer.exe"
          if (-not (Test-Path $e)) { throw "infer missing" }
          $esha=(Get-FileHash -Algorithm SHA256 $e).Hash.ToLower()
          if ($esha -ne $env:PLUTO_INFER_SHA256) { throw "infer SHA mismatch $esha" }
          "PLUTO_INFER=$e" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "OFFICIAL_INFER_READY=PASS"

      - name: Disassemble I8 dump xrefs
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          Push-Location pluto-team
          python analyze_i8_dump_xrefs_v1_5_2.py `
            --exe "$env:PLUTO_INFER" `
            --out "phase2b-v1.5.2-out"
          Pop-Location

      - name: Remove official runtime
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "pluto-team\official-release") {
            Remove-Item -Recurse -Force "pluto-team\official-release"
          }

      - name: Upload xref diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aPlutoTeam-Phase2B-v1.5.2-I8-Dump-Xref-Disassembly
          path: pluto-team/phase2b-v1.5.2-out
          if-no-files-found: error
          compression-level: 9
