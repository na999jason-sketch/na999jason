name: aPlutoTeamRuntime v113 x86 Ally Distress Context + v112 Pressure

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PLUTO_RELEASE_URL: https://github.com/tscmoo/pluto/releases/download/cog2026-2578600/pluto-cog2026-2578600.zip
      PLUTO_RELEASE_SHA256: d4e2225446f5048e131065357173952f0286586da77ebb8bddf7fc766c3844a5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare v113 from proven v112 baseline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git clone --depth 1 https://github.com/NomaDamas/starcraft-api.git src
          git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git minhook

          $base='pluto-team\aPlutoTeamRuntime_X86LegacyShadowOwnerMatch_v104.zip'
          if(!(Test-Path $base)){throw "missing proven v104 source ZIP: $base"}
          Expand-Archive $base overlay_v104 -Force
          Copy-Item 'overlay_v104\*' src -Recurse -Force

          $v113='pluto-team\aPlutoTeamRuntime_X86AllyDistress_v113.zip'
          if(!(Test-Path $v113)){$v113='aPlutoTeamRuntime_X86AllyDistress_v113.zip'}
          if(!(Test-Path $v113)){throw 'missing v113 source package'}
          Expand-Archive $v113 overlay_v113 -Force

          foreach($f in @('PlutoSCRX86TeamRuntimeV104.cpp','build-v113.ps1')){
            if(!(Test-Path (Join-Path overlay_v113 $f))){throw "missing v113 source $f"}
            Copy-Item (Join-Path overlay_v113 $f) (Join-Path 'src\plutoscr_x86' $f) -Force
          }
          foreach($f in @('RUN_PLUTO_TEAMRUNTIME_X86_V113.cmd','README_TEAMRUNTIME_V113.txt')){
            if(!(Test-Path (Join-Path overlay_v113 $f))){throw "missing v113 package file $f"}
            Copy-Item (Join-Path overlay_v113 $f) (Join-Path 'src\plutoscr_x86' $f) -Force
          }

          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/hyukim17/pluto-ai-remastered/44736dd754c9a07fb8efc6412f138fb6607bcd77/src/pluto_bindings.h' -OutFile 'src\plutoscr_x86\pluto_bindings.h'
          if(!(Test-Path 'minhook\include\MinHook.h')){throw 'MinHook missing'}

          $cpp=Get-Content 'src\plutoscr_x86\PlutoSCRX86TeamRuntimeV104.cpp' -Raw
          foreach($needle in @(
            'PLUTOTEAMRUNTIME_V113_RESIDENT=LOADED',
            'TEAM_RUNTIME_PLUTO_MODEL=OFFICIAL_UNMODIFIED_NO_TRAINING',
            'TEAM_RUNTIME_MODEL_OWNER_ENCODING=OFFICIAL_STOCK_SELF0_OTHER1_NEUTRAL2',
            'TEAM_RUNTIME_ALLY_ROLE_POLICY=ALLY_NONOWNED_DEFAULT_COMBAT_NEAR_ENEMY_PLUS_STRATEGIC_ASSET_DISTRESS_TEMP_SELF',
            'team110AllyInCombatContext',
            'kV110AllyCombatContextRadiusPx=512',
            'friendlyContext?0:2',
            'V113_ALLY_DISTRESS_CONTEXT=STRATEGIC_ASSET_NEAR_VISIBLE_ENEMY_TEMP_SELF_SUPPORT_RING',
            'kV113AllyDistressAssetRadiusPx=640',
            'kV113AllyDistressSupportRadiusPx=768',
            'team113AllyStrategicBuilding',
            'team113AllyDistressAnchor',
            'ally_distress_anchors=',
            'ally_distress_worker_anchors=',
            'ally_distress_assets_exposed=',
            'ally_distress_support_exposed=',
            'V113_DISTRESS_ANCHOR=WORKER_OR_RESOURCE_DEPOT_OR_PRODUCER_SELF_EXPOSE_BUILDINGS_ONLY',
            'V113_DIRECT_COMMANDS=NONE_OBSERVATION_ONLY',
            'V110_SHM_OWNER_REWRITE=PASS',
            'V112_TOP_LEVEL_ACTION_MASK_BIAS=DISABLED',
            'V112_EARLY_PRESSURE=SELF_CALIBRATING_ARG1_WORKER_SUPPRESSION_ONLY',
            'kV112PressureEndFrame=7500u',
            'kV112MinWorkers=9',
            'team112ApplyEarlyPressureArgBias(b,argMask,selfWorkers);',
            'V112_EARLY_PRESSURE=APPLIED frame=',
            'V112_ARG_LEARN frame=',
            'V112_EARLY_PRESSURE_SUMMARY frame=',
            'V112_FRAME_7500_PLUS=ORIGINAL_PLUTO_STRATEGY_100_PERCENT',
            'VALUE_LE_NEG035_OFF_NEG035_TO_NEG020_LIGHT',
            'b+0x79940u',
            'team112ObserveDecision(data->frameCount)',
            'V111_BURROW_POLICY=LURKER_ONLY_RESEARCH_DROP_NONLURKER_BURROW_DROP_LURKER_ALLOW',
            'kV111BurrowingTechId=11u',
            'V111_PLUTO_WIN_VALUE_SOURCE=OFFICIAL_SHM_RESPONSE_OFFSET_0x85F60',
            'team111ObserveWinValue(data->frameCount)',
            'team111IsTransientUnitHandleError',
            'V1111_COMMAND_TRANSIENT_DROP frame=',
            'policy=DROP_THIS_PLUTO_DECISION_CONTINUE_NEXT_FRAME',
            'V1111_TRANSIENT_COMMAND_SUMMARY',
            'return shape=="3,256"',
            'TEAM_TRAINING_RECORDER=CONFIRMED_DISABLED_V113'
          )){
            if(!$cpp.Contains($needle)){throw "v113 source guard missing: $needle"}
          }
          if($cpp.Contains('team109ApplyEarlyArmyPreference(b,actionMask,selfWorkers);')){throw 'v113 must not invoke v109 top-level action-mask bias'}
          if($cpp.Contains('recorder33ArmAfterFirstFrame(matchGeneration')){throw 'v113 must not arm PTRJ recorder'}
          if($cpp.Contains('pluto_weights_team4')){throw 'v113 must not use patched/team4 weights'}
          # Hard guarantee: v112 opening-pressure core is source-identical.
          $v112ref='pluto-team\aPlutoTeamRuntime_X86ArgumentPressure_v112.zip'
          if(!(Test-Path $v112ref)){throw 'v112 reference ZIP missing'}
          Expand-Archive $v112ref overlay_v112_ref -Force
          $ref112=(Get-Content 'overlay_v112_ref\PlutoSCRX86TeamRuntimeV104.cpp' -Raw).Replace("`r`n","`n")
          $new113=$cpp.Replace("`r`n","`n")
          $start112='// v112 argument-level early pressure.'
          $end112='// v110 observation-only ally separation.'
          $ra=$ref112.IndexOf($start112);$rb=$ref112.IndexOf($end112,$ra)
          $na=$new113.IndexOf($start112);$nb=$new113.IndexOf($end112,$na)
          if($ra -lt 0 -or $rb -lt 0 -or $na -lt 0 -or $nb -lt 0){throw 'v112 pressure comparison markers missing'}
          if($ref112.Substring($ra,$rb-$ra).TrimEnd() -cne $new113.Substring($na,$nb-$na).TrimEnd()){throw 'v112 pressure core changed in v113'}
          Write-Host 'V113_V112_PRESSURE_CORE_EXACT=PASS'
          Write-Host 'V113_V109_TOP_LEVEL_ACTION_BIAS_DISABLED=PASS'
          Write-Host 'V113_FRAME_7500_OPENING_BIAS_OFF=PASS'
          Write-Host 'V113_ALLY_DISTRESS_OBSERVATION_ONLY=PASS'
          Write-Host 'V113_V1111_STALE_HANDLE_RECOVERY_PRESENT=PASS'
          Write-Host 'V113_SOURCE_GUARDS=PASS'

          Get-ChildItem src -Recurse -Filter '*.vcxproj' | ForEach-Object {
            $x=Get-Content $_.FullName -Raw
            $x=$x.Replace('<PlatformToolset>v141_xp</PlatformToolset>','<PlatformToolset>v143</PlatformToolset>')
            $x=$x.Replace('<PlatformToolset>v141</PlatformToolset>','<PlatformToolset>v143</PlatformToolset>')
            Set-Content $_.FullName $x -Encoding UTF8
          }
          $p='src\bwapi\BWAPILIB\BWAPILIB.vcxproj'
          $x=Get-Content $p -Raw
          $x=$x.Replace('<AdditionalIncludeDirectories>','<AdditionalIncludeDirectories>$(ProjectDir)Source;$(ProjectDir)..;')
          Set-Content $p $x -Encoding UTF8
          Set-Content 'src\bwapi\BWAPILIB\Source\svnrev.h' '#pragma once' -Encoding ASCII
          Add-Content 'src\bwapi\BWAPILIB\Source\svnrev.h' '#define SVN_REV 0' -Encoding ASCII
          Add-Content 'src\bwapi\BWAPILIB\Source\svnrev.h' '#define BUILD_DEBUG 0' -Encoding ASCII
          Write-Host 'PLUTOTEAMRUNTIME_V113_PREPARE=PASS'

      - name: Build BWAPI static libraries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vw="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs=& $vw -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if(!$vs){throw 'Visual Studio/MSBuild not found'}
          $ms=Get-ChildItem "$vs\MSBuild" -Recurse -Filter 'MSBuild.exe' | Where-Object {$_.FullName -notlike '*\amd64\*'} | Select-Object -First 1
          if(!$ms){throw 'MSBuild.exe not found'}
          & $ms.FullName 'src\bwapi\BWAPILIB\BWAPILIB.vcxproj' /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal
          if($LASTEXITCODE -ne 0){throw "BWAPILIB failed: $LASTEXITCODE"}
          & $ms.FullName 'src\bwapi\BWAPIClient\BWAPIClient.vcxproj' /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal
          if($LASTEXITCODE -ne 0){throw "BWAPIClient failed: $LASTEXITCODE"}
          Write-Host 'PLUTOTEAMRUNTIME_V113_BWAPI_LIBS=PASS'

      - name: Direct compile and link v113 resident
        shell: powershell
        run: .\src\plutoscr_x86\build-v113.ps1

      - name: Validate official stock Pluto model contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory official_unpack -Force | Out-Null
          curl.exe -L --fail --retry 5 --retry-delay 3 -o official_pluto.zip $env:PLUTO_RELEASE_URL
          if($LASTEXITCODE -ne 0){throw 'official download failed'}
          $sha=(Get-FileHash -Algorithm SHA256 official_pluto.zip).Hash.ToLower()
          if($sha -ne $env:PLUTO_RELEASE_SHA256){throw "release SHA mismatch $sha"}
          Expand-Archive official_pluto.zip official_unpack -Force

          $infer='official_unpack\pluto\pluto_infer.exe'
          $weights='official_unpack\pluto\pluto_weights.bin'
          [byte[]]$b=[IO.File]::ReadAllBytes((Resolve-Path $infer))
          $sig=($b[59201..59206] | ForEach-Object {$_.ToString('X2')}) -join ''
          if($sig -ne '41B903000000'){throw "official owner gate is not stock 3-way: $sig"}

          [byte[]]$raw=[IO.File]::ReadAllBytes((Resolve-Path $weights))
          [UInt64]$hlen=[BitConverter]::ToUInt64($raw,8)
          $hdr=([Text.Encoding]::UTF8.GetString($raw,16,[int]$hlen) | ConvertFrom-Json)
          $t=$hdr.tensors | Where-Object {$_.name -eq 'owner_emb.weight'} | Select-Object -First 1
          if([int]$t.shape[0] -ne 3 -or [int]$t.shape[1] -ne 256){throw 'official owner embedding is not [3,256]'}
          $winHead=$hdr.tensors | Where-Object {$_.name -eq 'solo_win_head.out_proj.weight'} | Select-Object -First 1
          if(!$winHead){throw 'official solo_win_head missing'}
          Write-Host 'V113_OFFICIAL_SOLO_WIN_HEAD_PRESENT=PASS'
          Write-Host 'V113_OFFICIAL_MODEL_GATE=3_PASS'
          Write-Host 'V113_OFFICIAL_OWNER_EMB_3X256=PASS'
          Write-Host 'V113_MODEL_PATCHING=NONE_PASS'

      - name: Assemble v113 runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory artifact_v113 -Force | Out-Null
          Copy-Item 'build_v113\PlutoSCRX86TeamRuntimeV113.dll' artifact_v113
          Copy-Item 'build_v113\PlutoSCRX86Inject.exe' artifact_v113
          Copy-Item 'src\plutoscr_x86\RUN_PLUTO_TEAMRUNTIME_X86_V113.cmd' artifact_v113
          Copy-Item 'src\plutoscr_x86\README_TEAMRUNTIME_V113.txt' artifact_v113
          $restore=Get-ChildItem src -Recurse -File -Filter 'RESTORE_PLUTO_OFFICIAL_V104.cmd' | Select-Object -First 1
          if($restore){Copy-Item $restore.FullName 'artifact_v113\RESTORE_PLUTO_OFFICIAL_V113.cmd'}
          foreach($f in @(
            'PlutoSCRX86TeamRuntimeV113.dll',
            'PlutoSCRX86Inject.exe',
            'RUN_PLUTO_TEAMRUNTIME_X86_V113.cmd',
            'README_TEAMRUNTIME_V113.txt'
          )){
            if(!(Test-Path (Join-Path artifact_v113 $f))){throw "missing artifact $f"}
          }
          Write-Host 'PLUTOTEAMRUNTIME_V113_PACKAGE=PASS'

      - name: Upload v113 runtime
        uses: actions/upload-artifact@v4
        with:
          name: aPlutoTeamRuntime-v113-X86-Ally-Distress-v112-Pressure
          path: artifact_v113
          if-no-files-found: error
          compression-level: 9
