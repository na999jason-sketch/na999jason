name: aPlutoSCR v99 x86 Coherent State Retry + Multi-Match

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git clone --depth 1 https://github.com/NomaDamas/starcraft-api.git src
          git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git minhook
          Expand-Archive -Path 'aPlutoSCR_X86CoherentStateRetry_v99.zip' -DestinationPath 'overlay_v99' -Force
          Copy-Item -Path 'overlay_v99\*' -Destination 'src' -Recurse -Force

          $resident='src\plutoscr_x86\PlutoSCRX86V99.cpp'
          $inj='src\PlutoSCRX86Inject.cpp'
          if(!(Test-Path $resident)){throw 'PlutoSCRX86V99.cpp missing after overlay copy'}
          if(!(Test-Path $inj)){throw 'PlutoSCRX86Inject.cpp missing after overlay copy'}
          $rs=Get-Content $resident -Raw
          if($rs -notmatch 'projectRealPlayerRelations'){throw 'v99 real-player relation bridge missing'}
          if($rs -notmatch '58692u'){throw 'v99 SCR alliance matrix offset missing'}
          if($rs -notmatch 'gamedata\.relations=BOUND_REAL_SCR'){throw 'v99 relation diagnostics missing'}
          if($rs -notmatch 'profile_bullet\.live_refresh=TRANSIENT_RETRY_SKIP'){throw 'v99 transient bullet retry missing'}
          if($rs -notmatch 'profile_bullet\.live_refresh=RECOVERED'){throw 'v99 bullet recovery diagnostic missing'}
          if($rs -notmatch 'bulletRefreshFailStreak<8'){throw 'v99 bounded bullet retry guard missing'}
          if($rs -notmatch 'profile_heads=ACTIVE_NOT_MAPPED_TRANSIENT'){throw 'v99 transient active-head guard missing'}
          if($rs -notmatch 'profile_heads\.hidden_unmapped=REFERENCE_NULL'){throw 'v99 reference-compatible hidden-head null semantics missing'}
          if($rs -notmatch 'cunit_snapshot=SHADOW_COUNT_MISMATCH_TRANSIENT_RETRY_SKIP'){throw 'v99 transient CUnit retry missing'}
          if($rs -notmatch 'cunit_snapshot=RECOVERED'){throw 'v99 CUnit recovery diagnostic missing'}
          if($rs -notmatch 'cunitRefreshFailStreak<8'){throw 'v99 bounded CUnit retry guard missing'}
          $ix=Get-Content $inj -Raw
          if($ix -notmatch '(?i)#include\s*[<\"]tlhelp32\.h[>\"]'){throw 'TlHelp32.h missing'}
          if($ix -match 'PROCESSENTRY32A|Process32FirstA|Process32NextA'){throw 'explicit Toolhelp32 A-suffix API unexpectedly present'}
          if($ix -notmatch 'PROCESSENTRY32' -or $ix -notmatch 'Process32First' -or $ix -notmatch 'Process32Next'){throw 'generic Toolhelp32 API missing'}
          Write-Host 'PLUTOSCR_V99_COHERENT_STATE_SOURCE=PASS'
          Write-Host 'PLUTOSCR_V99_INJECTOR_GENERIC_TOOLHELP=PASS'

          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/chan22222/Pluto-AI-Starcraft-Remaster/44736dd754c9a07fb8efc6412f138fb6607bcd77/src/pluto_bindings.h' -OutFile 'src\plutoscr_x86\pluto_bindings.h'
          if(!(Test-Path 'src\plutoscr_x86\pluto_bindings.h')){throw 'pluto_bindings.h download failed'}
          if(!(Test-Path 'minhook\include\MinHook.h')){throw 'MinHook clone failed'}
          Write-Host 'PLUTOSCR_V99_EXACT_BINDINGS_HEADER=PASS'
          Write-Host 'PLUTOSCR_V99_MINHOOK_SOURCE=PASS'

          Get-ChildItem 'src' -Recurse -Filter '*.vcxproj' | ForEach-Object {
            $x=Get-Content $_.FullName -Raw
            $x=$x.Replace('<PlatformToolset>v141_xp</PlatformToolset>','<PlatformToolset>v143</PlatformToolset>')
            $x=$x.Replace('<PlatformToolset>v141</PlatformToolset>','<PlatformToolset>v143</PlatformToolset>')
            Set-Content $_.FullName $x -Encoding UTF8
          }

          $p='src\bwapi\BWAPILIB\BWAPILIB.vcxproj'
          $x=Get-Content $p -Raw
          $x=$x.Replace('<AdditionalIncludeDirectories>','<AdditionalIncludeDirectories>$(ProjectDir)Source;$(ProjectDir)..;')
          Set-Content $p $x -Encoding UTF8

          $svn='src\bwapi\BWAPILIB\Source\svnrev.h'
          Set-Content $svn '#pragma once' -Encoding ASCII
          Add-Content $svn '#define SVN_REV 0' -Encoding ASCII
          Add-Content $svn '#define BUILD_DEBUG 0' -Encoding ASCII
          if(!(Test-Path $svn)){throw 'svnrev.h generation failed'}
          Write-Host 'PLUTOSCR_V99_PREPARE=PASS'

      - name: Build BWAPI static libraries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vw="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if(!(Test-Path $vw)){throw 'vswhere missing'}
          $vs=& $vw -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if(!$vs){throw 'Visual Studio/MSBuild not found'}
          $ms=Get-ChildItem "$vs\MSBuild" -Recurse -Filter 'MSBuild.exe' |
            Where-Object {$_.FullName -match '\\Bin\\MSBuild\.exe$' -and $_.FullName -notmatch '\\amd64\\'} |
            Select-Object -First 1
          if(!$ms){throw 'MSBuild.exe not found'}

          & $ms.FullName 'src\bwapi\BWAPILIB\BWAPILIB.vcxproj' /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal
          if($LASTEXITCODE -ne 0){throw "BWAPILIB failed: $LASTEXITCODE"}
          & $ms.FullName 'src\bwapi\BWAPIClient\BWAPIClient.vcxproj' /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal
          if($LASTEXITCODE -ne 0){throw "BWAPIClient failed: $LASTEXITCODE"}
          Write-Host 'PLUTOSCR_V99_BWAPI_LIBS=PASS'

      - name: Direct compile and link v99 coherent-state resident
        shell: powershell
        run: .\src\plutoscr_x86\build-v99.ps1

      - name: Assemble and verify
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory 'artifact_v99' -Force | Out-Null
          Copy-Item 'build_v99\PlutoSCRX86V99.dll' 'artifact_v99\PlutoSCRX86V99.dll'
          Copy-Item 'build_v99\PlutoSCRX86Inject.exe' 'artifact_v99\PlutoSCRX86Inject.exe'
          foreach($n in @('RUN_PLUTO_SCR_X86_V99.cmd','README_V99.txt')){
            $f=Get-ChildItem 'src' -Recurse -File -Filter $n | Select-Object -First 1
            if($f){Copy-Item $f.FullName 'artifact_v99'}
          }
          $d=(Get-Item 'artifact_v99\PlutoSCRX86V99.dll').Length
          $e=(Get-Item 'artifact_v99\PlutoSCRX86Inject.exe').Length
          if($d -lt 50000){throw "DLL too small: $d"}
          if($e -lt 5000){throw "Injector too small: $e"}
          Write-Host "PlutoSCRX86V99.dll=$d bytes"
          Write-Host "PlutoSCRX86Inject.exe=$e bytes"
          Write-Host 'PLUTOSCR_V99_X86_DIRECT_LINK_BUILD=PASS'

      - name: Upload v99 coherent state retry
        uses: actions/upload-artifact@v4
        with:
          name: aPlutoSCR-v99-X86-Coherent-State-Retry
          path: artifact_v99
          if-no-files-found: error
