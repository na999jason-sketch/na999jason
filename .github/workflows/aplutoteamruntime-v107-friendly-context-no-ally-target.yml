name: aPlutoTeamRuntime v107 x86 Friendly Context No Ally Target

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PLUTO_RELEASE_URL: https://github.com/tscmoo/pluto/releases/download/cog2026-2578600/pluto-cog2026-2578600.zip
      PLUTO_RELEASE_SHA256: d4e2225446f5048e131065357173952f0286586da77ebb8bddf7fc766c3844a5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare v107 from proven v104 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git clone --depth 1 https://github.com/NomaDamas/starcraft-api.git src
          git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git minhook

          $base='pluto-team\aPlutoTeamRuntime_X86LegacyShadowOwnerMatch_v104.zip'
          if(!(Test-Path $base)){throw "missing proven v104 source ZIP: $base"}
          Expand-Archive $base overlay_v104 -Force
          Copy-Item 'overlay_v104\*' src -Recurse -Force

          $v107='pluto-team\aPlutoTeamRuntime_X86FriendlyContextNoTarget_v107.zip'
          if(!(Test-Path $v107)){$v107='aPlutoTeamRuntime_X86FriendlyContextNoTarget_v107.zip'}
          if(!(Test-Path $v107)){throw 'missing v107 source package'}
          Expand-Archive $v107 overlay_v107 -Force

          foreach($f in @('PlutoSCRX86TeamRuntimeV104.cpp','PlutoTeamRuntimePrepV104.cpp')){
            if(!(Test-Path (Join-Path overlay_v107 $f))){throw "missing v107 source $f"}
            Copy-Item (Join-Path overlay_v107 $f) (Join-Path 'src\plutoscr_x86' $f) -Force
          }
          foreach($f in @('PATCH_ALLY_FRIENDLY_V107.ps1','RUN_PLUTO_TEAMRUNTIME_X86_V107.cmd','README_TEAMRUNTIME_V107.txt')){
            if(!(Test-Path (Join-Path overlay_v107 $f))){throw "missing v107 package file $f"}
            Copy-Item (Join-Path overlay_v107 $f) (Join-Path 'src\plutoscr_x86' $f) -Force
          }

          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/chan22222/Pluto-AI-Starcraft-Remaster/44736dd754c9a07fb8efc6412f138fb6607bcd77/src/pluto_bindings.h' -OutFile 'src\plutoscr_x86\pluto_bindings.h'
          if(!(Test-Path 'minhook\include\MinHook.h')){throw 'MinHook missing'}

          # Guard the exact conceptual fix before compilation.
          $cpp=Get-Content 'src\plutoscr_x86\PlutoSCRX86TeamRuntimeV104.cpp' -Raw
          foreach($needle in @(
            'b+0x79100',
            'b+0x79500',
            'actorMask[r]=0',
            'targetMask[r]=0',
            'ALLY_EQUALS_SELF_FRIENDLY_CONTEXT_V107'
          )){
            if(!$cpp.Contains($needle)){throw "v107 semantic source guard missing: $needle"}
          }

          # Guard the launcher ordering: actual prep invocation first, patch invocation second.
          $run=Get-Content 'src\plutoscr_x86\RUN_PLUTO_TEAMRUNTIME_X86_V107.cmd'
          $prepLine=-1; $patchLine=-1
          for($i=0;$i -lt $run.Count;$i++){
            if($run[$i] -match '^"%ROOT%\\PlutoTeamRuntimePrepV104\.exe"'){$prepLine=$i}
            if($run[$i] -match '^powershell .*PATCH_ALLY_FRIENDLY_V107\.ps1'){$patchLine=$i}
          }
          if($prepLine -lt 0 -or $patchLine -lt 0 -or $patchLine -le $prepLine){
            throw "launcher ordering invalid prep=$prepLine patch=$patchLine"
          }
          Write-Host "V107_LAUNCHER_ORDER=PASS prep_line=$prepLine patch_line=$patchLine"

          Get-ChildItem src -Recurse -Filter '*.vcxproj' | ForEach-Object {
            $x=Get-Content $_.FullName -Raw
            $x=$x.Replace('<PlatformToolset>v141_xp</PlatformToolset>','<PlatformToolset>v143</PlatformToolset>')
            $x=$x.Replace('<PlatformToolset>v141</PlatformToolset>','<PlatformToolset>v143</PlatformToolset>')
            Set-Content $_.FullName $x -Encoding UTF8
          }
          $p='src\bwapi\BWAPILIB\BWAPILIB.vcxproj'
          $x=Get-Content $p -Raw
          $x=$x.Replace('<AdditionalIncludeDirectories>','<AdditionalIncludeDirectories>$(ProjectDir)Source;$(ProjectDir)..;')
          Set-Content $p $x -Encoding UTF8
          Set-Content 'src\bwapi\BWAPILIB\Source\svnrev.h' '#pragma once' -Encoding ASCII
          Add-Content 'src\bwapi\BWAPILIB\Source\svnrev.h' '#define SVN_REV 0' -Encoding ASCII
          Add-Content 'src\bwapi\BWAPILIB\Source\svnrev.h' '#define BUILD_DEBUG 0' -Encoding ASCII

          Write-Host 'PLUTOTEAMRUNTIME_V107_PREPARE=PASS'

      - name: Build BWAPI static libraries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vw="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs=& $vw -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if(!$vs){throw 'Visual Studio/MSBuild not found'}
          $ms=Get-ChildItem "$vs\MSBuild" -Recurse -Filter 'MSBuild.exe' | Where-Object {$_.FullName -notlike '*\amd64\*'} | Select-Object -First 1
          if(!$ms){throw 'MSBuild.exe not found'}
          & $ms.FullName 'src\bwapi\BWAPILIB\BWAPILIB.vcxproj' /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal
