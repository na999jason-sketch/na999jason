name: PlutoSCR v38 x86 Direct Loader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Extract v38 overlay
        shell: powershell
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "PlutoSCR_X86Direct_v38.zip"
          $dst = Join-Path $env:RUNNER_TEMP "v38"
          if (!(Test-Path -LiteralPath $zip)) { throw "Missing overlay: $zip" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dst -Force

      - name: Build x86 resident and injector
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1
          cd /d "%RUNNER_TEMP%\v38"
          cl /nologo /std:c++17 /O2 /EHsc /LD PlutoSCRX86Resident.cpp /Fe:PlutoSCRX86Resident.dll
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /O2 /EHsc PlutoSCRX86Inject.cpp /Fe:PlutoSCRX86Inject.exe
          if errorlevel 1 exit /b 1
          if not exist "PlutoSCRX86Resident.dll" exit /b 2
          if not exist "PlutoSCRX86Inject.exe" exit /b 3
          echo PLUTOSCR_V38_X86_DIRECT_BUILD=PASS

      - name: Assemble and verify v38 package
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP "v38"
          $out = Join-Path $env:RUNNER_TEMP "PlutoSCR-v38-X86-Direct"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $required = @(
            "PlutoSCRX86Resident.dll",
            "PlutoSCRX86Inject.exe",
            "RUN_PLUTO_SCR_X86_V38.cmd",
            "README_V38.txt"
          )

          foreach ($name in $required) {
            $p = Join-Path $src $name
            if (!(Test-Path -LiteralPath $p)) { throw "Package source missing: $p" }
            Copy-Item -LiteralPath $p -Destination $out -Force
          }

          foreach ($name in $required) {
            $p = Join-Path $out $name
            if (!(Test-Path -LiteralPath $p)) { throw "Package verification failed: $p" }
          }

          Get-ChildItem -LiteralPath $out | Select-Object Name,Length | Format-Table -AutoSize
          Write-Host "PLUTOSCR_V38_X86_DIRECT_PACKAGE=PASS"

      - name: Upload v38
        uses: actions/upload-artifact@v4
        with:
          name: PlutoSCR-v38-X86-Direct
          path: ${{ runner.temp }}\PlutoSCR-v38-X86-Direct
          if-no-files-found: error
