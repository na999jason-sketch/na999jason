name: aPlutoTeam Phase2C v1.2 Sequential Recurrent Ordering

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLUTO_RELEASE_URL: https://github.com/tscmoo/pluto/releases/download/cog2026-2578600/pluto-cog2026-2578600.zip
      PLUTO_RELEASE_SHA256: d4e2225446f5048e131065357173952f0286586da77ebb8bddf7fc766c3844a5
      PLUTO_INFER_SHA256: ad880d8be52a6ef03893fa20644b6627e04fcd55e030178c6d52486b82340f2b
      PLUTO_WEIGHTS_SHA256: 00b400eace6e4782202ebdcb3c30db76054aaa6a08c6a7dcb59575abc2d0a26e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Phase2C v1.2 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip='pluto-team\aPlutoTeam_Phase2C_v1_2_SequentialRecurrence.zip'
          if(!(Test-Path $zip)){throw "missing $zip"}
          Remove-Item -Recurse -Force 'pluto-team\phase2c-v1.2' -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force 'pluto-team\phase2c-v1.2' | Out-Null
          Expand-Archive -Path $zip -DestinationPath 'pluto-team\phase2c-v1.2' -Force
          foreach($f in @('phase2c_v1_2_sequence_recurrence.py','pluto_trunk.py','plwb.py','expand_owner_plwb_4way.py','sequence\manifest.json')){
            if(!(Test-Path (Join-Path 'pluto-team\phase2c-v1.2' $f))){throw "missing package file $f"}
          }
          Write-Host 'PHASE2C_V1_2_SOURCE_READY=PASS'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download exact official Pluto
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path 'pluto-team\phase2c-v1.2').Path
          New-Item -ItemType Directory -Force "$root\official" | Out-Null
          $zip="$root\official\pluto.zip"
          curl.exe -L --fail --retry 5 --retry-delay 3 -o $zip $env:PLUTO_RELEASE_URL
          if($LASTEXITCODE -ne 0){throw 'official release download failed'}
          if((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower() -ne $env:PLUTO_RELEASE_SHA256){throw 'release SHA mismatch'}
          Expand-Archive $zip "$root\official\unpacked" -Force
          $exe="$root\official\unpacked\pluto\pluto_infer.exe"
          $weights="$root\official\unpacked\pluto\pluto_weights.bin"
          if((Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower() -ne $env:PLUTO_INFER_SHA256){throw 'infer SHA mismatch'}
          if((Get-FileHash -Algorithm SHA256 $weights).Hash.ToLower() -ne $env:PLUTO_WEIGHTS_SHA256){throw 'weights SHA mismatch'}
          "OFFICIAL_EXE=$exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "OFFICIAL_WEIGHTS=$weights" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PHASE2C_V1_2_OFFICIAL_RELEASE=PASS'

      - name: Build seeded four-way official engine
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path 'pluto-team\phase2c-v1.2').Path
          $w4="$root\official\pluto_weights_team4seed.bin"
          $e4="$root\official\pluto_infer_team4.exe"
          Push-Location $root
          python .\expand_owner_plwb_4way.py $env:OFFICIAL_WEIGHTS $w4
          if($LASTEXITCODE -ne 0){throw '4-way PLWB build failed'}
          Pop-Location
          Copy-Item $env:OFFICIAL_EXE $e4 -Force
          $b=[IO.File]::ReadAllBytes($e4)
          $sig=($b[59201..59206] | ForEach-Object {$_.ToString('X2')}) -join ''
          if($sig -ne '41B903000000'){throw "unexpected owner gate $sig"}
          $b[59203]=4
          [IO.File]::WriteAllBytes($e4,$b)
          $b2=[IO.File]::ReadAllBytes($e4)
          $sig2=($b2[59201..59206] | ForEach-Object {$_.ToString('X2')}) -join ''
          if($sig2 -ne '41B904000000'){throw "owner gate patch failed $sig2"}
          "TEAM4_EXE=$e4" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TEAM4_WEIGHTS=$w4" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PHASE2C_V1_2_FOURWAY_SEED=PASS'

      - name: Run sequential recurrent ordering grid
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path 'pluto-team\phase2c-v1.2').Path
          Push-Location $root
          New-Item -ItemType Directory -Force 'out' | Out-Null
          python .\phase2c_v1_2_sequence_recurrence.py `
            --team4-exe $env:TEAM4_EXE `
            --team4-weights $env:TEAM4_WEIGHTS `
            --sequence .\sequence `
            --out .\out
          if($LASTEXITCODE -ne 0){throw "Phase2C v1.2 failed: $LASTEXITCODE"}
          Get-Content .\out\phase2c_v1_2_summary.txt
          Pop-Location

      - name: Remove temporary official binaries
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force 'pluto-team\phase2c-v1.2\official' -ErrorAction SilentlyContinue

      - name: Upload Phase2C v1.2 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aPlutoTeam-Phase2C-v1.2-Sequential-Recurrent-Ordering
          path: pluto-team/phase2c-v1.2/out
          if-no-files-found: error
          compression-level: 9
