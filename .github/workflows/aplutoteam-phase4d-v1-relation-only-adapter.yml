name: aPlutoTeam Phase4D v1 Relation Only Low Rank Adapter

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      PLUTO_RELEASE_URL: https://github.com/tscmoo/pluto/releases/download/cog2026-2578600/pluto-cog2026-2578600.zip
      PLUTO_RELEASE_SHA256: d4e2225446f5048e131065357173952f0286586da77ebb8bddf7fc766c3844a5
      PLUTO_INFER_SHA256: ad880d8be52a6ef03893fa20644b6627e04fcd55e030178c6d52486b82340f2b
      PLUTO_WEIGHTS_SHA256: 00b400eace6e4782202ebdcb3c30db76054aaa6a08c6a7dcb59575abc2d0a26e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Phase4D package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip='pluto-team\aPlutoTeam_Phase4D_v1_RelationOnlyAdapter.zip'
          if(!(Test-Path $zip)){$zip='aPlutoTeam_Phase4D_v1_RelationOnlyAdapter.zip'}
          if(!(Test-Path $zip)){throw 'missing Phase4D package in pluto-team/ or repository root'}
          Remove-Item -Recurse -Force 'pluto-team\phase4d-v1' -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force 'pluto-team\phase4d-v1' | Out-Null
          Expand-Archive -Path $zip -DestinationPath 'pluto-team\phase4d-v1' -Force
          foreach($f in @('phase4d_relation_only_adapter.py','expand_owner_plwb_4way.py','make_fp32_plwb_generic.py','plwb.py','README.md','samples\manifest.json')){
            if(!(Test-Path (Join-Path 'pluto-team\phase4d-v1' $f))){throw "missing package file $f"}
          }
          Write-Host 'PHASE4D_SOURCE_READY=PASS'

      - name: Install numpy
        run: python -m pip install numpy

      - name: Validate samples
        shell: pwsh
        run: |
          Push-Location 'pluto-team\phase4d-v1'
          @'
          import hashlib,json,struct
          from pathlib import Path
          p=Path('samples'); m=json.loads((p/'manifest.json').read_text(encoding='utf-8'))
          assert len(m['samples'])==48
          cats={}
          for x in m['samples']:
              b=(p/x['file']).read_bytes()
              assert hashlib.sha256(b).hexdigest()==x['sha256']
              n,w,h,*_=struct.unpack_from('<iii',b,0)
              assert n==x['n'] and (w,h)==(128,128)
              cats[x['category']]=cats.get(x['category'],0)+1
          assert cats=={'peace_dense':12,'enemy_preserve':12,'peace_block':12,'ally_threat':12}
          print('PHASE4D_SAMPLE_VALIDATION=PASS',cats)
          '@ | python -
          Pop-Location

      - name: Download exact official Pluto release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='pluto-team\phase4d-v1'
          New-Item -ItemType Directory -Force "$root\official" | Out-Null
          $z="$root\official\pluto.zip"
          curl.exe -L --fail --retry 5 --retry-delay 3 -o $z $env:PLUTO_RELEASE_URL
          if($LASTEXITCODE -ne 0){throw 'official release download failed'}
          if((Get-FileHash -Algorithm SHA256 $z).Hash.ToLower() -ne $env:PLUTO_RELEASE_SHA256){throw 'release SHA mismatch'}
          Expand-Archive $z "$root\official\unpacked" -Force
          $exe="$root\official\unpacked\pluto\pluto_infer.exe"
          $w="$root\official\unpacked\pluto\pluto_weights.bin"
          if((Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower() -ne $env:PLUTO_INFER_SHA256){throw 'infer SHA mismatch'}
          if((Get-FileHash -Algorithm SHA256 $w).Hash.ToLower() -ne $env:PLUTO_WEIGHTS_SHA256){throw 'weights SHA mismatch'}
          "OFFICIAL_EXE=$((Resolve-Path $exe).Path)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "OFFICIAL_WEIGHTS=$((Resolve-Path $w).Path)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PHASE4D_OFFICIAL_RELEASE=PASS'

      - name: Build four-way int8 and FP32 official models
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path 'pluto-team\phase4d-v1').Path
          $w4=Join-Path $root 'official\pluto_weights_team4.bin'
          $e4=Join-Path $root 'official\pluto_infer_team4.exe'
          python "$root\expand_owner_plwb_4way.py" $env:OFFICIAL_WEIGHTS $w4
          if($LASTEXITCODE -ne 0){throw 'owner expansion failed'}
          Copy-Item $env:OFFICIAL_EXE $e4 -Force
          $b=[IO.File]::ReadAllBytes($e4)
          $sig=($b[59201..59206] | ForEach-Object {$_.ToString('X2')}) -join ''
          if($sig -ne '41B903000000'){throw "unexpected owner gate $sig"}
          $b[59203]=4
          [IO.File]::WriteAllBytes($e4,$b)
          if(((([IO.File]::ReadAllBytes($e4))[59201..59206] | ForEach-Object {$_.ToString('X2')}) -join '') -ne '41B904000000'){throw '4-way exe patch failed'}
          $wf=Join-Path $root 'official\pluto_weights_team4_fp32.bin'
          $man=Join-Path $root 'official\fp32_manifest.json'
          python "$root\make_fp32_plwb_generic.py" --input $w4 --output $wf --manifest $man
          if($LASTEXITCODE -ne 0){throw 'FP32 export failed'}
          "TEAM4_EXE=$e4" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TEAM4_INT8=$w4" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TEAM4_FP32=$wf" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PHASE4D_TEAM4_MODELS=PASS'

      - name: Train ALLY-only relation adapter
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path 'pluto-team\phase4d-v1').Path
          Push-Location $root
          New-Item -ItemType Directory -Force 'out' | Out-Null
          python .\phase4d_relation_only_adapter.py `
            --exe $env:TEAM4_EXE `
            --int8-weights $env:TEAM4_INT8 `
            --fp32-weights $env:TEAM4_FP32 `
            --samples .\samples `
            --out .\out
          if($LASTEXITCODE -ne 0){throw "Phase4D failed: $LASTEXITCODE"}
          Get-Content .\out\phase4d_v1_summary.txt
          Pop-Location

      - name: Remove temporary full models
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force 'pluto-team\phase4d-v1\official' -ErrorAction SilentlyContinue

      - name: Upload Phase4D result
        uses: actions/upload-artifact@v4
        with:
          name: aPlutoTeam-Phase4D-v1-Relation-Only-Adapter
          path: pluto-team/phase4d-v1/out
          if-no-files-found: error
          compression-level: 6
