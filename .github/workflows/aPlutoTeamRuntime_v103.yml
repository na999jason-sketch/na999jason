name: aPlutoTeamRuntime v103 x86 Team Training Recorder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35

    env:
      PLUTO_RELEASE_URL: https://github.com/tscmoo/pluto/releases/download/cog2026-2578600/pluto-cog2026-2578600.zip
      PLUTO_RELEASE_SHA256: d4e2225446f5048e131065357173952f0286586da77ebb8bddf7fc766c3844a5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare v103 training-recorder source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git clone --depth 1 https://github.com/NomaDamas/starcraft-api.git src
          git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git minhook

          $zip='pluto-team\aPlutoTeamRuntime_X86TrainingRecorder_v103.zip'
          if(!(Test-Path $zip)){throw "v103 source ZIP missing: $zip"}
          Expand-Archive -Path $zip -DestinationPath 'overlay_v103' -Force
          Copy-Item -Path 'overlay_v103\*' -Destination 'src' -Recurse -Force

          $resident='src\plutoscr_x86\PlutoSCRX86TeamRuntimeV103.cpp'
          $prep='src\plutoscr_x86\PlutoTeamRuntimePrepV103.cpp'
          $parser='src\plutoscr_x86\trajectory_v103.py'
          foreach($f in @($resident,$prep,$parser,'src\PlutoSCRX86Inject.cpp')){if(!(Test-Path $f)){throw "missing $f"}}
          $rs=Get-Content $resident -Raw
          $ps=Get-Content $prep -Raw

          foreach($m in @(
            'projectRealPlayerRelations',
            '58692u',
            'profile_bullet.live_refresh=TRANSIENT_RETRY_SKIP',
            'bulletRefreshFailStreak<8',
            'cunit_snapshot=SHADOW_COUNT_MISMATCH_TRANSIENT_RETRY_SKIP',
            'cunitRefreshFailStreak<8',
            'scr_command_translation=PASS',
            'scr_command_sink=ARMED_GAME_THREAD_ONE_FRAME_DELAY',
            'TEAM_RUNTIME_ALLY_TARGET_BLOCK',
            'TEAM_RUNTIME_CUNIT_LIST=ALLY_VISIBLE_FULL_CHAIN',
            'TEAM_RUNTIME_MODE=FOURWAY_OWNER_INGAME',
            'TEAM_RUNTIME_MODEL_OWNER_ENCODING=SELF0_ALLY1_ENEMY2_NEUTRAL3',
            'TEAM_RUNTIME_TEAM4_SEED=ALLY_EQUALS_ENEMY_INITIAL_WEIGHTS'
          )){if($rs -notmatch [regex]::Escape($m)){throw "missing proven invariant: $m"}}

          foreach($m in @(
            'TEAM4_OWNER_MATCH_SOURCE=LEGACY_SHADOW_EXACT_OBSERVATION',
            'g_legacyCUnits[i].b',
            'TEAM_TRAINING_RECORDER=REQUEST_RESPONSE_TEAM_OUTCOME',
            'TEAM_TRAINING_RECORDER=STEP_PASS',
            'recorderCaptureRequest',
            'recorderCommitResponse',
            'PTRJ103',
            '0x85f40',
            '0x79100',
            '0x79500',
            '0x79900',
            '0x79940',
            '0x79a40',
            '0x79f00',
            '0x81f00',
            '0x85f00'
          )){if($rs -notmatch [regex]::Escape($m)){throw "missing v103 recorder invariant: $m"}}

          if($rs -match 'ORIGINAL_3WAY_NOT_YET_4WAY'){throw 'stale 3-way marker present'}
          if($rs -match 'ALLY_OPAQUE'){throw 'obsolete ally opaque mode present'}

          foreach($m in @(
            '59203',
            'ad880d8be52a6ef03893fa20644b6627e04fcd55e030178c6d52486b82340f2b',
            '00b400eace6e4782202ebdcb3c30db76054aaa6a08c6a7dcb59575abc2d0a26e',
            'owner_emb.weight',
            '4,256',
            'TEAM4_PREP=PASS'
          )){if($ps -notmatch [regex]::Escape($m)){throw "runtime prep invariant missing: $m"}}

          python $parser --selftest
          if($LASTEXITCODE -ne 0){throw 'PTRJ103 parser selftest failed'}
          Write-Host 'PLUTOTEAMRUNTIME_V103_SOURCE_INVARIANTS=PASS'

          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/chan22222/Pluto-AI-Starcraft-Remaster/44736dd754c9a07fb8efc6412f138fb6607bcd77/src/pluto_bindings.h' -OutFile 'src\plutoscr_x86\pluto_bindings.h'
          if(!(Test-Path 'src\plutoscr_x86\pluto_bindings.h')){throw 'pluto_bindings.h download failed'}
          if(!(Test-Path 'minhook\include\MinHook.h')){throw 'MinHook clone failed'}

          Get-ChildItem 'src' -Recurse -Filter '*.vcxproj' | ForEach-Object {
            $x=Get-Content $_.FullName -Raw
            $x=$x.Replace('<PlatformToolset>v141_xp</PlatformToolset>','<PlatformToolset>v143</PlatformToolset>')
            $x=$x.Replace('<PlatformToolset>v141</PlatformToolset>','<PlatformToolset>v143</PlatformToolset>')
            Set-Content $_.FullName $x -Encoding UTF8
          }
          $p='src\bwapi\BWAPILIB\BWAPILIB.vcxproj'
          $x=Get-Content $p -Raw
          $x=$x.Replace('<AdditionalIncludeDirectories>','<AdditionalIncludeDirectories>$(ProjectDir)Source;$(ProjectDir)..;')
          Set-Content $p $x -Encoding UTF8
          $svn='src\bwapi\BWAPILIB\Source\svnrev.h'
          Set-Content $svn '#pragma once' -Encoding ASCII
          Add-Content $svn '#define SVN_REV 0' -Encoding ASCII
          Add-Content $svn '#define BUILD_DEBUG 0' -Encoding ASCII
          Write-Host 'PLUTOTEAMRUNTIME_V103_PREPARE=PASS'

      - name: Build BWAPI static libraries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vw="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if(!(Test-Path $vw)){throw 'vswhere missing'}
          $vs=& $vw -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if(!$vs){throw 'Visual Studio/MSBuild not found'}
          $ms=Get-ChildItem "$vs\MSBuild" -Recurse -Filter 'MSBuild.exe' |
            Where-Object {$_.FullName -match '\\Bin\\MSBuild\.exe$' -and $_.FullName -notmatch '\\amd64\\'} |
            Select-Object -First 1
          if(!$ms){throw 'MSBuild.exe not found'}
          & $ms.FullName 'src\bwapi\BWAPILIB\BWAPILIB.vcxproj' /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal
          if($LASTEXITCODE -ne 0){throw "BWAPILIB failed: $LASTEXITCODE"}
          & $ms.FullName 'src\bwapi\BWAPIClient\BWAPIClient.vcxproj' /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal
          if($LASTEXITCODE -ne 0){throw "BWAPIClient failed: $LASTEXITCODE"}
          Write-Host 'PLUTOTEAMRUNTIME_V103_BWAPI_LIBS=PASS'

      - name: Direct compile and link v103
        shell: powershell
        run: .\src\plutoscr_x86\build-v103.ps1

      - name: Validate v103 runtime prep against exact official Pluto
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory 'runtime_test\pluto' -Force | Out-Null
          New-Item -ItemType Directory 'official_unpack' -Force | Out-Null
          curl.exe -L --fail --retry 5 --retry-delay 3 -o 'official_pluto.zip' $env:PLUTO_RELEASE_URL
          if($LASTEXITCODE -ne 0){throw 'official download failed'}
          $sha=(Get-FileHash -Algorithm SHA256 'official_pluto.zip').Hash.ToLower()
          if($sha -ne $env:PLUTO_RELEASE_SHA256){throw "release SHA mismatch $sha"}
          Expand-Archive 'official_pluto.zip' 'official_unpack' -Force
          Copy-Item 'official_unpack\pluto\pluto_infer.exe' 'runtime_test\pluto\pluto_infer.exe'
          Copy-Item 'official_unpack\pluto\pluto_weights.bin' 'runtime_test\pluto\pluto_weights.bin'

          & '.\build_v103\PlutoTeamRuntimePrepV103.exe' "$PWD\runtime_test"
          if($LASTEXITCODE -ne 0){throw "runtime prep selftest failed: $LASTEXITCODE"}

          $b=[IO.File]::ReadAllBytes((Resolve-Path 'runtime_test\pluto\pluto_infer.exe'))
          $sig=($b[59201..59206] | ForEach-Object {$_.ToString('X2')}) -join ''
          if($sig -ne '41B904000000'){throw "patched engine signature mismatch: $sig"}

          python 'src\plutoscr_x86\probe-v103-team4.py' --root 'runtime_test'
          if($LASTEXITCODE -ne 0){throw 'four-way parity probe failed'}
          Write-Host 'PLUTOTEAMRUNTIME_V103_OFFICIAL_ENGINE_PARITY=PASS'

          Remove-Item -Recurse -Force 'runtime_test','official_unpack'
          Remove-Item -Force 'official_pluto.zip'

      - name: Assemble and verify v103 recorder runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory 'artifact_v103' -Force | Out-Null
          Copy-Item 'build_v103\PlutoSCRX86TeamRuntimeV103.dll' 'artifact_v103\PlutoSCRX86TeamRuntimeV103.dll'
          Copy-Item 'build_v103\PlutoSCRX86Inject.exe' 'artifact_v103\PlutoSCRX86Inject.exe'
          Copy-Item 'build_v103\PlutoTeamRuntimePrepV103.exe' 'artifact_v103\PlutoTeamRuntimePrepV103.exe'

          foreach($n in @(
            'RUN_PLUTO_TEAMRUNTIME_X86_V103.cmd',
            'RESTORE_PLUTO_OFFICIAL_V103.cmd',
            'PACK_PLUTO_TEAM_TRAINING_DATA_V103.cmd',
            'README_TEAMRUNTIME_V103.txt',
            'trajectory_v103.py'
          )){
            $f=Get-ChildItem 'src' -Recurse -File -Filter $n | Select-Object -First 1
            if(!$f){throw "missing package file: $n"}
            Copy-Item $f.FullName 'artifact_v103'
          }

          foreach($f in @(
            'artifact_v103\PlutoSCRX86TeamRuntimeV103.dll',
            'artifact_v103\PlutoSCRX86Inject.exe',
            'artifact_v103\PlutoTeamRuntimePrepV103.exe'
          )){
            $b=[IO.File]::ReadAllBytes((Resolve-Path $f))
            $pe=[BitConverter]::ToInt32($b,0x3c)
            $m=[BitConverter]::ToUInt16($b,$pe+4)
            Write-Host ("PE_MACHINE {0} 0x{1:X4}" -f $f,$m)
            if($m -ne 0x014c){throw "non-x86 output: $f"}
          }

          $d=(Get-Item 'artifact_v103\PlutoSCRX86TeamRuntimeV103.dll').Length
          $p=(Get-Item 'artifact_v103\PlutoTeamRuntimePrepV103.exe').Length
          if($d -lt 50000){throw "DLL too small: $d"}
          if($p -lt 10000){throw "prep too small: $p"}
          Write-Host "V103_DLL_BYTES=$d PREP_BYTES=$p"
          Write-Host 'PLUTOTEAMRUNTIME_V103_X86_BUILD_PACKAGE=PASS'

      - name: Upload v103 training-recorder runtime
        uses: actions/upload-artifact@v4
        with:
          name: aPlutoTeamRuntime-v103-X86-Team-Training-Recorder
          path: artifact_v103
          if-no-files-found: error
          compression-level: 9
