name: PlutoSCR v48 x86 Live CUnit Original Pluto Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git clone --depth 1 https://github.com/NomaDamas/starcraft-api.git src
          Expand-Archive -Path "PlutoSCR_X86LiveCUnit_v48.zip" -DestinationPath "overlay_v48" -Force
          Copy-Item -Path "overlay_v48\*" -Destination "src" -Recurse -Force

          $bwapiLibProject = "src\bwapi\BWAPILIB\BWAPILIB.vcxproj"
          $bx = Get-Content $bwapiLibProject -Raw
          $bx = $bx -replace '<AdditionalIncludeDirectories>', '<AdditionalIncludeDirectories>$(ProjectDir)Source;$(ProjectDir)..;'
          Set-Content $bwapiLibProject $bx -Encoding UTF8

          Get-ChildItem "src" -Recurse -Filter *.vcxproj | ForEach-Object {
            $p = $_.FullName
            $x = Get-Content $p -Raw
            $x = $x -replace '<PlatformToolset>v141_xp</PlatformToolset>','<PlatformToolset>v143</PlatformToolset>'
            $x = $x -replace '<PlatformToolset>v141</PlatformToolset>','<PlatformToolset>v143</PlatformToolset>'
            Set-Content $p $x -Encoding UTF8
          }

      - name: Build x86 BWAPI resident and injector
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }

          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw "Visual Studio with MSBuild not found" }

          $msbuild = Get-ChildItem "$vs\MSBuild" -Recurse -Filter MSBuild.exe |
            Where-Object { $_.FullName -match '\\Bin\\MSBuild\.exe$' -and $_.FullName -notmatch '\\amd64\\' } |
            Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild.exe not found under $vs" }

          $vcvars = Get-ChildItem "$vs\VC\Auxiliary\Build" -Filter vcvars32.bat -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $vcvars) { throw "vcvars32.bat not found under $vs" }

          Write-Host "VS=$vs"
          Write-Host "MSBUILD=$($msbuild.FullName)"
          Write-Host "VCVARS32=$($vcvars.FullName)"

          $cmd = @"
          call "$($vcvars.FullName)"
          "$($msbuild.FullName)" src\plutoscr_x86\PlutoSCRX86V48.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /fl /flp:logfile=msbuild-v48.log;verbosity=diagnostic
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /O2 /DWIN32 /D_WINDOWS src\PlutoSCRX86Inject.cpp /Fe:PlutoSCRX86Inject.exe /link kernel32.lib
          if errorlevel 1 exit /b 1
          "@

          cmd.exe /D /S /C $cmd
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path "msbuild-v48.log") { Get-Content "msbuild-v48.log" -Tail 800 }
            throw "v48 build failed with exit code $LASTEXITCODE"
          }

      - name: Assemble and verify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "artifact_v48" -Force | Out-Null

          $dll = Get-ChildItem "src\plutoscr_x86" -Recurse -Filter "PlutoSCRX86V48.dll" | Select-Object -First 1
          if (-not $dll) { throw "PlutoSCRX86V48.dll not found" }
          Copy-Item $dll.FullName "artifact_v48\PlutoSCRX86V48.dll" -Force

          if (-not (Test-Path "PlutoSCRX86Inject.exe")) { throw "PlutoSCRX86Inject.exe not found" }
          Copy-Item "PlutoSCRX86Inject.exe" "artifact_v48\PlutoSCRX86Inject.exe" -Force

          $extras = @("RUN_PLUTO_SCR_X86_V48.cmd","README_V48.txt")
          foreach ($name in $extras) {
            $f = Get-ChildItem "src" -Recurse -Filter $name | Select-Object -First 1
            if ($f) { Copy-Item $f.FullName "artifact_v48\$name" -Force }
          }

          $dllSize=(Get-Item "artifact_v48\PlutoSCRX86V48.dll").Length
          $exeSize=(Get-Item "artifact_v48\PlutoSCRX86Inject.exe").Length
          Write-Host "PlutoSCRX86V48.dll=$dllSize bytes"
          Write-Host "PlutoSCRX86Inject.exe=$exeSize bytes"
          if ($dllSize -lt 50000) { throw "Unexpectedly small DLL" }
          if ($exeSize -lt 5000) { throw "Unexpectedly small injector" }

          Write-Host "PLUTOSCR_V48_X86_LIVE_CUNIT_BUILD=PASS"
          Write-Host "PLUTOSCR_V48_X86_LIVE_CUNIT_PACKAGE=PASS"

      - name: Upload v48
        uses: actions/upload-artifact@v4
        with:
          name: PlutoSCR-v48-X86-Live-CUnit
          path: artifact_v48
          if-no-files-found: error
